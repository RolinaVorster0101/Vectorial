<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vectorial — vector editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0f12;
  --panel:#15181c;
  --panel-2:#1b1f24;
  --panel-3:#20242a;
  --border:#262b31;
  --text:#e8eaed;
  --text-dim:#8b939c;
  --text-faint:#565d66;
  --accent:#ff8a3d;
  --accent-2:#38e1c6;
  --danger:#ff5d5d;
  --font-ui: 'Space Grotesk', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:var(--font-ui);
  overflow:hidden;
}
#app{ display:flex; flex-direction:column; height:100vh; }

/* ---------- Top bar ---------- */
#topbar{
  height:52px; flex:0 0 auto; display:flex; align-items:center; gap:10px;
  padding:0 14px; background:var(--panel); border-bottom:1px solid var(--border);
}
#brand{ display:flex; align-items:center; gap:8px; margin-right:8px; }
#brand .mark{ width:20px;height:20px; }
#brand span{ font-weight:700; font-size:15px; letter-spacing:0.02em; }
.topbar-sep{ width:1px; height:24px; background:var(--border); margin:0 4px; }
.tbtn{
  display:flex; align-items:center; gap:6px; height:32px; padding:0 11px;
  background:var(--panel-2); border:1px solid var(--border); border-radius:7px;
  color:var(--text); font-family:var(--font-ui); font-size:12.5px; cursor:pointer;
}
.tbtn:hover{ background:var(--panel-3); border-color:#333a42; }
.tbtn:active{ transform:translateY(1px); }
.tbtn.primary{ background:var(--accent); border-color:var(--accent); color:#20140a; font-weight:600; }
.tbtn.primary:hover{ filter:brightness(1.08); }
.icononly{ width:32px; padding:0; justify-content:center; }
#zoomGroup{ display:flex; align-items:center; gap:4px; margin-left:auto; }
#zoomLabel{ font-family:var(--font-mono); font-size:12px; color:var(--text-dim); width:44px; text-align:center; }

/* ---------- Workspace ---------- */
#workspace{ flex:1 1 auto; display:flex; min-height:0; }

/* Left toolbar */
#toolbar{
  width:52px; flex:0 0 auto; background:var(--panel); border-right:1px solid var(--border);
  display:flex; flex-direction:column; align-items:center; padding:10px 0; gap:4px;
}
.tool-btn{
  width:36px; height:36px; border-radius:8px; border:1px solid transparent; background:transparent;
  color:var(--text-dim); display:flex; align-items:center; justify-content:center; cursor:pointer;
}
.tool-btn:hover{ background:var(--panel-2); color:var(--text); }
.tool-btn.active{ background:rgba(255,138,61,0.15); border-color:var(--accent); color:var(--accent); }
.tool-sep{ width:26px; height:1px; background:var(--border); margin:6px 0; }

/* Canvas area */
#canvasArea{ flex:1 1 auto; display:flex; flex-direction:column; min-width:0; background:var(--bg); }
#rulerRow{ display:flex; height:20px; flex:0 0 auto; }
#rulerCorner{ width:20px; height:20px; background:var(--panel); border-bottom:1px solid var(--border); border-right:1px solid var(--border); flex:0 0 auto; }
#rulerTop{ flex:1 1 auto; background:var(--panel); border-bottom:1px solid var(--border); overflow:hidden; }
#canvasRow{ flex:1 1 auto; display:flex; min-height:0; }
#rulerLeft{ width:20px; flex:0 0 auto; background:var(--panel); border-right:1px solid var(--border); overflow:hidden; }
#canvasWrap{ flex:1 1 auto; position:relative; overflow:hidden; background:
  radial-gradient(circle at 1px 1px, #22262c 1px, transparent 0) 0 0/22px 22px, var(--bg); }
#canvasSvg{ width:100%; height:100%; display:block; touch-action:none; }
#emptyHint{
  position:absolute; inset:0; display:none; align-items:center; justify-content:center;
  color:var(--text-faint); font-size:13px; pointer-events:none;
}
#textEditor{
  position:absolute; display:none; background:transparent; border:1px dashed var(--accent-2);
  outline:none; resize:none; padding:2px; min-width:60px; line-height:1.2;
  font-family:'Space Grotesk', sans-serif;
}

/* Right panels */
#rightPanel{ width:260px; flex:0 0 auto; background:var(--panel); border-left:1px solid var(--border); display:flex; flex-direction:column; min-height:0; }
.panel-section{ display:flex; flex-direction:column; min-height:0; }
#layersSection{ flex:1 1 45%; border-bottom:1px solid var(--border); }
#propsSection{ flex:1 1 55%; overflow-y:auto; }
.panel-header{
  height:34px; flex:0 0 auto; display:flex; align-items:center; padding:0 12px;
  font-size:11px; font-weight:600; letter-spacing:0.08em; color:var(--text-dim);
  border-bottom:1px solid var(--border); text-transform:uppercase;
}
#layersList{ flex:1 1 auto; overflow-y:auto; padding:4px; }
.panel-empty{ color:var(--text-faint); font-size:12px; padding:14px 10px; line-height:1.5; }

.layer-row{
  display:flex; align-items:center; gap:6px; padding:6px 6px; border-radius:6px; cursor:pointer;
  border:1px solid transparent;
}
.layer-row:hover{ background:var(--panel-2); }
.layer-row.selected{ background:rgba(56,225,198,0.10); border-color:var(--accent-2); }
.icon-btn{ background:none; border:none; color:var(--text-faint); cursor:pointer; width:18px; height:18px; display:flex; align-items:center; justify-content:center; flex:0 0 auto; }
.icon-btn:hover{ color:var(--text); }
.layer-swatch{ width:12px; height:12px; border-radius:3px; border:1.5px solid #444; flex:0 0 auto; }
.layer-name{ flex:1 1 auto; font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; outline:none; }
.layer-name[contenteditable="true"]{ background:var(--panel-3); border-radius:3px; padding:0 2px; }
.layer-type{ font-family:var(--font-mono); font-size:9.5px; color:var(--text-faint); text-transform:uppercase; flex:0 0 auto; }
.del{ opacity:0; }
.layer-row:hover .del{ opacity:1; }

#propsBody{ padding:12px; display:flex; flex-direction:column; gap:9px; }
.props-section-title{ font-size:10px; letter-spacing:0.08em; color:var(--text-faint); margin:6px 0 2px; text-transform:uppercase; }
.props-section-title:first-child{ margin-top:0; }
.prop-field{ display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:12px; color:var(--text-dim); }
.prop-field.full{ flex-direction:column; align-items:stretch; gap:4px; }
.prop-field input[type="number"]{
  width:86px; background:var(--panel-2); border:1px solid var(--border); border-radius:5px; color:var(--text);
  padding:5px 7px; font-family:var(--font-mono); font-size:12px;
}
.prop-field input[type="range"]{ width:120px; accent-color:var(--accent); }
.prop-field textarea, .prop-field select{
  background:var(--panel-2); border:1px solid var(--border); border-radius:5px; color:var(--text);
  padding:6px 7px; font-family:var(--font-ui); font-size:12.5px; width:100%;
}
.color-field{ display:flex; align-items:center; gap:8px; }
.color-field input[type="color"]{
  width:30px; height:26px; border-radius:5px; border:1px solid var(--border); background:none; padding:0; cursor:pointer;
}
.none-toggle{ display:flex; align-items:center; gap:4px; font-size:11px; color:var(--text-faint); cursor:pointer; }
.hint-text{ font-size:11.5px; color:var(--text-faint); line-height:1.5; }

.fill-mode-toggle, .grad-type-toggle{ display:flex; gap:4px; }
.fmode-btn, .gtype-btn{
  background:var(--panel-2); border:1px solid var(--border); color:var(--text-dim); font-size:11px;
  padding:4px 10px; border-radius:5px; cursor:pointer; font-family:var(--font-ui);
}
.fmode-btn:hover, .gtype-btn:hover{ background:var(--panel-3); }
.fmode-btn.active{ background:var(--accent); color:#20140a; border-color:var(--accent); font-weight:600; }
.gtype-btn.active{ background:var(--accent-2); color:#04211c; border-color:var(--accent-2); font-weight:600; }
.gradient-bar{
  position:relative; height:26px; border-radius:6px; border:1px solid var(--border);
  cursor:copy; margin-top:2px;
  background-image:
    linear-gradient(45deg, #33383f 25%, transparent 25%), linear-gradient(-45deg, #33383f 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, #33383f 75%), linear-gradient(-45deg, transparent 75%, #33383f 75%);
  background-size:10px 10px; background-position:0 0, 0 5px, 5px -5px, -5px 0px; background-color:#20242a;
}
.grad-handle{
  position:absolute; top:50%; width:14px; height:14px; border-radius:50%;
  border:2px solid #fff; box-shadow:0 0 0 1px #000; transform:translate(-50%,-50%); cursor:grab;
}
.grad-handle.selected{ box-shadow:0 0 0 2px var(--accent), 0 0 0 3px #000; }
.grad-handle:active{ cursor:grabbing; }

/* Status bar */
#statusbar{
  height:26px; flex:0 0 auto; display:flex; align-items:center; padding:0 14px; gap:14px;
  background:var(--panel); border-top:1px solid var(--border); font-size:11px; color:var(--text-faint);
}
#toast{
  position:fixed; bottom:40px; left:50%; transform:translateX(-50%) translateY(10px);
  background:var(--panel-3); border:1px solid var(--border); color:var(--text);
  padding:10px 16px; border-radius:8px; font-size:12.5px; max-width:420px; text-align:center;
  opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease; z-index:50;
  box-shadow:0 8px 24px rgba(0,0,0,0.4);
}
#toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

svg#canvasSvg text{ user-select:none; }
::-webkit-scrollbar{ width:8px; height:8px; }
::-webkit-scrollbar-thumb{ background:#2a2f36; border-radius:4px; }
::-webkit-scrollbar-track{ background:transparent; }
</style>
</head>
<body>
<div id="app">

  <header id="topbar">
    <div id="brand">
      <svg class="mark" viewBox="0 0 24 24"><path d="M3 20 L12 4 L21 20 Z" fill="none" stroke="#ff8a3d" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="4" r="2" fill="#38e1c6"/><circle cx="3" cy="20" r="2" fill="#38e1c6"/><circle cx="21" cy="20" r="2" fill="#38e1c6"/></svg>
      <span>Vectorial</span>
    </div>
    <div class="topbar-sep"></div>
    <button class="tbtn" id="btnImportTrigger">Import SVG / EPS</button>
    <input type="file" id="fileInput" accept=".svg,.eps,.ps,.ai" style="display:none">
    <button class="tbtn primary" id="btnExportSvg">Export SVG</button>
    <div class="topbar-sep"></div>
    <button class="tbtn icononly" id="btnUndo" title="Undo (Ctrl+Z)">
      <svg width="15" height="15" viewBox="0 0 24 24"><path fill="currentColor" d="M12.5 8c-3 0-5.6 1.5-7.2 3.8L2 8.5V17h8.5l-3.6-3.6C8.1 11.5 10.1 10.3 12.5 10.3c3.4 0 6.3 2.3 7.2 5.4l2.1-.6C20.6 11 17 8 12.5 8z"/></svg>
    </button>
    <button class="tbtn icononly" id="btnRedo" title="Redo (Ctrl+Shift+Z)">
      <svg width="15" height="15" viewBox="0 0 24 24" style="transform:scaleX(-1)"><path fill="currentColor" d="M12.5 8c-3 0-5.6 1.5-7.2 3.8L2 8.5V17h8.5l-3.6-3.6C8.1 11.5 10.1 10.3 12.5 10.3c3.4 0 6.3 2.3 7.2 5.4l2.1-.6C20.6 11 17 8 12.5 8z"/></svg>
    </button>
    <div id="zoomGroup">
      <button class="tbtn icononly" id="btnZoomOut" title="Zoom out">–</button>
      <span id="zoomLabel">100%</span>
      <button class="tbtn icononly" id="btnZoomIn" title="Zoom in">+</button>
      <button class="tbtn" id="btnZoom100" title="Zoom to 100%">100%</button>
      <button class="tbtn" id="btnZoomFit" title="Fit content">Fit</button>
    </div>
  </header>

  <main id="workspace">
    <aside id="toolbar" title="Tools">
      <button class="tool-btn" data-tool="select" title="Select (V)">
        <svg width="17" height="17" viewBox="0 0 24 24"><path fill="currentColor" d="M4 3l7 17 2.2-6.8L20 11 4 3z"/></svg>
      </button>
      <button class="tool-btn" data-tool="node" title="Edit nodes (A)">
        <svg width="17" height="17" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" d="M4 18 C 6 6, 14 20, 20 6"/><circle cx="4" cy="18" r="2" fill="currentColor"/><circle cx="20" cy="6" r="2" fill="currentColor"/></svg>
      </button>
      <div class="tool-sep"></div>
      <button class="tool-btn" data-tool="pen" title="Pen (P)">
        <svg width="16" height="16" viewBox="0 0 24 24"><path fill="currentColor" d="M20.7 3.3a2.4 2.4 0 0 0-3.4 0L5 15.6V19h3.4L20.7 6.7a2.4 2.4 0 0 0 0-3.4z"/></svg>
      </button>
      <button class="tool-btn" data-tool="rect" title="Rectangle (R)">
        <svg width="17" height="17" viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
      </button>
      <button class="tool-btn" data-tool="ellipse" title="Ellipse (E)">
        <svg width="17" height="17" viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="8" ry="6" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
      </button>
      <button class="tool-btn" data-tool="line" title="Line (L)">
        <svg width="17" height="17" viewBox="0 0 24 24"><line x1="5" y1="19" x2="19" y2="5" stroke="currentColor" stroke-width="1.8"/></svg>
      </button>
      <button class="tool-btn" data-tool="text" title="Text (T)">
        <svg width="16" height="16" viewBox="0 0 24 24"><path fill="currentColor" d="M4 4h16v3h-6.5v13h-3V7H4V4z"/></svg>
      </button>
      <div class="tool-sep"></div>
      <button class="tool-btn" id="btnDuplicate" title="Duplicate (Ctrl+D)">
        <svg width="15" height="15" viewBox="0 0 24 24"><rect x="3" y="7" width="12" height="14" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.7"/><rect x="9" y="3" width="12" height="14" rx="1.5" fill="var(--bg)" stroke="currentColor" stroke-width="1.7"/></svg>
      </button>
      <button class="tool-btn" id="btnDelete" title="Delete (Del)">
        <svg width="15" height="15" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.7" d="M5 7h14M9 7V5h6v2m-9 0 1 13h10l1-13"/></svg>
      </button>
    </aside>

    <div id="canvasArea">
      <div id="rulerRow">
        <div id="rulerCorner"></div>
        <div id="rulerTop"></div>
      </div>
      <div id="canvasRow">
        <div id="rulerLeft"></div>
        <div id="canvasWrap">
          <svg id="canvasSvg" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <pattern id="dotgrid" width="22" height="22" patternUnits="userSpaceOnUse">
                <circle cx="1" cy="1" r="1" fill="#20242a"/>
              </pattern>
            </defs>
            <rect id="gridRect" fill="url(#dotgrid)"></rect>
            <defs id="gradientDefs"></defs>
            <g id="shapesLayer"></g>
            <g id="overlayLayer"></g>
          </svg>
          <div id="emptyHint">Draw a shape, or import an SVG / EPS file to begin.</div>
          <textarea id="textEditor" rows="1"></textarea>
        </div>
      </div>
    </div>

    <aside id="rightPanel">
      <section class="panel-section" id="layersSection">
        <div class="panel-header">Layers</div>
        <div id="layersList"></div>
      </section>
      <section class="panel-section" id="propsSection">
        <div class="panel-header">Properties</div>
        <div id="propsBody"></div>
      </section>
    </aside>
  </main>

  <footer id="statusbar">
    <span id="statusText">Click to select · drag to move · drag handles to resize · shift-click for multi-select</span>
  </footer>
  <div id="toast"></div>
</div>

<script>
__APP_JS__
</script>
</body>
</html>
